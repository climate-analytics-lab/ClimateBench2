# ClimateBench v2 — Tier I: physical-consistency gates (pass/fail entry ticket).
# Spec: docs/metrics_reference.md; bounds: climatebench2/thresholds.yml.
#
# This suite holds the experiment-based (complex) gates. `Suite.get_database`
# passes ONE data object to every diagnostic, so run it with an experiment
# dict — `climatebench2 score --experiment picontrol=DIR --experiment
# 4xco2=DIR [--experiment histaer=DIR] [--experiment historical=DIR]`.
# CB2 complex diagnostics accept a superset of their required keys; gates
# whose experiments are missing fail with a clear message (or are skipped by
# the CLI when the key was never provided).
#
# Cube-based Tier I checks (ENSO) live in ClimateBench2_TierI_variability.
# Still missing from the protocol (Phase 4): geostrophic balance (I.3b),
# precip-buoyancy (I.3c), GFMIP patches (I.4a), amip-4xCO2 ERF (I.4b),
# MJO (I.5d), ENSO teleconnections (I.5c).

- name: ecs_gate                      # I.6c — piControl + abrupt-4xCO2
  diagnostic: climatebench2.diags.ECSGate
  additional_diagnostic_kwargs: {}

- name: energy_balance                # I.1 — piControl
  diagnostic: climatebench2.diags.EnergyBalanceGate
  additional_diagnostic_kwargs: {}

- name: closure                       # I.2a/b — piControl
  diagnostic: climatebench2.diags.ClosureGate
  additional_diagnostic_kwargs: {}

- name: clear_sky_feedback            # I.3a — historical
  diagnostic: climatebench2.diags.ClearSkyFeedbackGate
  additional_diagnostic_kwargs: {}

- name: land_ocean_warming            # I.6a — piControl + abrupt-4xCO2
  diagnostic: climatebench2.diags.LandOceanWarmingGate
  additional_diagnostic_kwargs: {}

- name: arctic_amplification          # I.6b — piControl + abrupt-4xCO2
  diagnostic: climatebench2.diags.ArcticAmplificationGate
  additional_diagnostic_kwargs: {}

- name: aerosol_forcing               # I.7 — piControl + abrupt-4xCO2 + hist-aer
  diagnostic: climatebench2.diags.AerosolForcingGate
  additional_diagnostic_kwargs: {}

- name: meridional_heat_transport     # I.8a — piControl
  diagnostic: climatebench2.diags.MeridionalHeatTransportGate
  additional_diagnostic_kwargs: {}

- name: itcz_efe                      # I.8b — historical (12-month climatology)
  diagnostic: climatebench2.diags.ITCZEFEGate
  additional_diagnostic_kwargs: {}

- name: bjerknes                      # extra — piControl
  diagnostic: climatebench2.diags.BjerknesGate
  additional_diagnostic_kwargs: {}

- name: cc_scaling                    # extra — piControl
  diagnostic: climatebench2.diags.CCScalingGate
  additional_diagnostic_kwargs: {}
