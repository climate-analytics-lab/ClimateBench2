# ClimateBench v2 — Tier II: scoring against observations.
# Core protocol variables (metrics_reference.md Tier II): tas, ts, pr, TOA
# fluxes, SST, sea ice, OHC, prw, clouds — evaluated with ClimateEval diagnostics
# against the protocol's observational references, with the CMIP6
# historical+SSP2-4.5 ensemble carried along as comparison (the MME baseline of
# the protocol, and the E_ref median of every score here). That ensemble is
# `climatebench2.data.StagedCMIP6HistoricalSSP245` — several members per model,
# enumerated in the staged data root; its module docstring says why it exists
# next to the equivalent upstream `climateeval.data.CMIP6HistoricalSSP245`.
#
# Scoring happens in the post-suite pass (climatebench2.scoring_pass), not in
# the diagnostics: the members of one model arrive as separate data sources,
# so a fair CRPS can only be formed after every member has run. This suite's
# job is to put the right series and fields in the database.
#
# The suite is cut to the reserved post-2015 test window (_cli.SUITE_REGISTRY),
# which also cuts the *reference*. Two entries deliberately reach back past
# that cut, through their own copy of the variable's timerange:
#   reference_baseline  the reference's 1985-2014 area-mean series, from which
#                       the pass builds the Climatology baseline's pseudo-
#                       members (without it there is no no-skill floor);
#   eof_projection      the regime-(b) basis — the reference's fixed pre-2015
#                       EOFs — and every source's test-window climatological
#                       anomaly projected onto it, standardised by the
#                       pre-2015 PC sigma.
# The regime-(c) trend consistency is no longer a diagnostic: the pass takes
# the trends from `annual_mean_timeseries` and combines the ensemble spread
# with the piControl sigma_int (Tier I suite) and sigma_obs.
#
# The paper's figure set is the nine variables tas, ts, pr, rsut, rlut, rsutcs,
# rlutcs, tos, siconc (Duncan, 2026-09). The cloud entries below (clt, clwvi,
# clivi) stay in the suite but are OUT of that set: their only reference,
# ESACCI-CLOUD, ends in 2016, so their scored window is two years of the test
# window and the fair CRPS falls below the scoring pass's minimum overlap.

- name: annual_mean_timeseries
  diagnostic: climatebench2.diags.ScoredAnnualMeanTimeSeries
  variables: &core_variables
    - id: tas
      var_name: tas
      frequency: mon
      reference_data: climateeval.data.HadCRUT5
      other_data: &comparison_ensemble
        # The CMIP6 comparison ensemble that E_ref is the median over
        # (metrics_reference.md II.0). Historical+SSP2-4.5, several members per
        # model, discovered in the staged data root -- see
        # climatebench2/data/cmip6_staged.py for why this and not upstream's
        # pool-globbing climateeval.data.CMIP6HistoricalSSP245 (identical ids).
        - climatebench2.data.StagedCMIP6HistoricalSSP245
    # Surface (skin) temperature, the second of the paper's two temperature
    # variables. Reference: MERRA2, not ERA5 -- ClimateEval's ERA5 source can
    # serve `ts` (upstream PR #48) but only by downloading it from the CDS,
    # and the staged ERA5 has no `ts`, whereas MERRA2 `ts` is staged monthly
    # for 1980-01..2021-12. That end date is what bounds the scored window:
    # `ts` is scored over 2015-2021, not the full test window
    # (climatebench2.reference_windows resolves and reports it).
    - id: ts
      var_name: ts
      frequency: mon
      reference_data: climateeval.data.MERRA2
      other_data: *comparison_ensemble
    - id: pr
      var_name: pr
      frequency: mon
      units: mm day-1
      reference_data: climateeval.data.GPCP
      other_data: *comparison_ensemble
    - id: rsut
      var_name: rsut
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: rlut
      var_name: rlut
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    # Derived (rsdt - rsut - rlut), so a comparison member needs all three —
    # `DataSource.get_cube` derives it from the staged rsdt/rsut/rlut of that
    # member and yields nothing for a member that is missing one of them.
    - id: rtnt
      var_name: rtnt
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    # Clear-sky TOA (paper Tier II core: "TOA fluxes, all- AND clear-sky").
    # CERES-EBAF carries both; separating clear-sky from all-sky is what
    # isolates the cloud-radiative contribution to a flux error.
    - id: rsutcs
      var_name: rsutcs
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: rlutcs
      var_name: rlutcs
      frequency: mon
      reference_data: climateeval.data.CERESEBAF
      other_data: *comparison_ensemble
    - id: prw
      var_name: prw
      frequency: mon
      reference_data: climateeval.data.ERA5Monthly
      other_data: *comparison_ensemble
    - id: clt
      var_name: clt
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      other_data: *comparison_ensemble
    # Condensed-water paths (paper Tier II extended: "cloud properties —
    # LWP, fraction"). ESACCI-CLOUD CMORizes clwvi/clivi/lwp alongside clt.
    # Cloud-top temperature/pressure remain missing (no DataSource). Like
    # `clt`, these are outside the paper's figure set: ESACCI-CLOUD ends 2016.
    - id: clwvi
      var_name: clwvi
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      other_data: *comparison_ensemble
    - id: clivi
      var_name: clivi
      frequency: mon
      reference_data: climateeval.data.ESACCICloud
      other_data: *comparison_ensemble

- name: reference_baseline
  diagnostic: climatebench2.diags.ReferenceBaselineRecord
  variables: *core_variables

- name: annual_cycle
  diagnostic: climateeval.diags.simple.AnnualCycle
  variables: *core_variables

- name: map
  diagnostic: climateeval.diags.simple.Map
  variables: *core_variables

- name: eof_projection
  diagnostic: climatebench2.diags.ReferenceEOFProjection
  variables: *core_variables

- name: zonal_line
  diagnostic: climateeval.diags.simple.ZonalLine
  variables: *core_variables

# --- Ocean -----------------------------------------------------------------
#
# The SST reference is EN4 (climateeval.data.EN4), not ESACCI-SST: EN4 is what
# is staged in ClimateEval form for this evaluation, ESACCI-SST is not, and a
# reference that does not resolve leaves every sst* row unscored. EN4's `tos`
# is the objective analysis' surface level, so it is an SST *analysis* rather
# than a satellite retrieval — the protocol names ESACCI-SST
# (metrics_reference.md Tier II), so swap the reference back the day it is
# staged. HadISST and NOAA-ERSSTv5 would be the natural second observational
# estimates (the sigma_obs spread term), but neither has `tos` in the staged
# root (HadISST is staged for `siconc` only), so both are dropped rather than
# left to log a missing-data warning per member per diagnostic.

- name: sst
  diagnostic: climatebench2.diags.ScoredAnnualMeanTimeSeries
  variables:
    - &tos
      id: tos
      var_name: tos
      frequency: mon
      reference_data: climateeval.data.EN4
      other_data: *comparison_ensemble

- name: sst_baseline
  diagnostic: climatebench2.diags.ReferenceBaselineRecord
  variables:
    - *tos

- name: sst_map
  diagnostic: climateeval.diags.simple.Map
  variables:
    - *tos

- name: sst_eof_projection
  diagnostic: climatebench2.diags.ReferenceEOFProjection
  variables:
    - *tos

- name: ohc
  diagnostic: climateeval.diags.simple.OceanHeatContentTimeSeries
  variables:
    - &ohc
      id: phcint_total
      var_name: phcint
      frequency: mon
      reference_data: climateeval.data.EN4
      other_data: [climateeval.data.IAP]
    # The paper names both layers: 0-2000 m (the standard OHC index) and
    # 0-100 m (the mixed layer, where the seasonal and interannual signal
    # lives). Both are annual global series with an EN4/IAP reference, so the
    # scoring pass picks them up as regime (a) like any other time series.
    - <<: *ohc
      id: phcint_2000m
      additional_preprocessors:
        esmvalcore.preprocessor.extract_volume:
          z_min: 0.0
          z_max: 2000.0
          interval_bounds: left_closed
    - <<: *ohc
      id: phcint_100m
      additional_preprocessors:
        esmvalcore.preprocessor.extract_volume:
          z_min: 0.0
          z_max: 100.0
          interval_bounds: left_closed

# --- Sea ice ---------------------------------------------------------------
#
# The protocol scores sea-ice EXTENT (sum of the area of every cell whose
# concentration reaches 15 %), not sea-ice area (sum of siconc x area) -- a
# different number, systematically larger and far less sensitive to a
# concentration bias. ClimateEval PR #47 added the extent diagnostics, so
# these stanzas now use them. There is NO `extent_threshold` diagnostic
# kwarg: the 15 % definition is the class default
# `SeaIceExtentTimeSeries._concentration_threshold`
# (`climateeval.diags.simple._sea_ice.SEA_ICE_EXTENT_THRESHOLD`); a suite that
# passes `extent_threshold:` would raise on an unexpected kwarg.
#
# Reference: HadISST, which is what is staged in ClimateEval form
# (`reanalysis_HadISST/mon/siconc`, ending 2021-12 -- so the scored window is
# the intersection of the test window with that record, not its full length).
# The protocol names OSI-450 / NSIDC-G02202; neither is staged, and a
# reference that does not resolve leaves every sea-ice row unscored, so the
# swap back is a one-line change once they are.

- name: sea_ice_annual_cycle
  diagnostic: climateeval.diags.simple.SeaIceExtentAnnualCycle
  variables:
    - id: siconc_nh_extent
      var_name: siconc
      frequency: mon
      min_lat: 30.0
      max_lat: 90.0
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble
    - id: siconc_sh_extent
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -30.0
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble

- name: sea_ice_minimum
  diagnostic: climateeval.diags.simple.SeaIceExtentTimeSeries
  variables:
    # NH September / SH February seasonal minima (paper Tier II sea-ice items).
    - id: siconc_nh_sep_extent
      var_name: siconc
      frequency: mon
      min_lat: 30.0
      max_lat: 90.0
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 9
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble
    - id: siconc_sh_feb_extent
      var_name: siconc
      frequency: mon
      min_lat: -90.0
      max_lat: -30.0
      additional_preprocessors:
        esmvalcore.preprocessor.extract_month:
          month: 2
      reference_data: climateeval.data.HadISST
      other_data: *comparison_ensemble
