# ClimateBench v2 — protocol thresholds
#
# Single source of truth for every pass/fail bound and scoring parameter in the
# ClimateBench v2 protocol. Populated from docs/metrics_reference.md (the
# authoritative spec, keyed by its section numbers); CB2 diagnostics read their
# bounds from here and must never hard-code them.
#
# Status: Phase 0 skeleton. Entries below are the paper-settled values; items
# marked TODO await protocol resolution (metrics_reference.md tracks each one).
#
# `requirement:` tags the protocol standing of every gate block (paper §7.1):
#   required   — must be passed for the model to be scored (the entry ticket)
#   extended   — reported alongside and earns additional credit, but does NOT
#                gate entry (no CMIP6-archived model can supply the inputs)
#   extra      — code-only sanity check, not in the paper's Tier I list
#   diagnostic — a Tier II aggregated diagnostic whose sign flags are emitted
#                through the gate machinery; never part of the entry ticket
# Gate classes read the tag via `pass_fail.gate_requirement("tier1.<block>")`;
# the leaderboard groups the scorecard by it. A Required test may still be
# declared *not applicable* per submission (`score --not-applicable NAME`,
# e.g. I.3b for a model with no dynamical representation).

version: 0

tier1:
  # I.1 Energy balance closure (piControl)
  energy_balance:
    requirement: required
    mean_toa_net_abs_max: 0.1          # W m-2, |mean(N)|
    drift_10yr_running_abs_max: 0.02   # W m-2 / decade, drift of 10-yr running mean
    evaluation_years: 100              # both criteria use the LAST 100 yr of piControl
                                       # (>=500 yr requested; shorter records are used
                                       # whole, with the length noted via `n_years`)

  # I.2a Water budget closure
  water_budget:
    requirement: required
    p_minus_e_abs_max: 0.05            # mm day-1, absolute

  # I.2b Atmospheric energy budget
  atm_energy_budget:
    requirement: required
    residual_abs_max: 2.0              # W m-2, |L·P − (Q_rad + SHF)|

  # I.3a Clear-sky LW feedback (gridpoint ∂rlutcs/∂Ts, historical)
  clear_sky_lw_feedback:
    requirement: required
    reference: 2.2                     # W m-2 K-1 (CERES; Koll & Cronin 2018)
    rel_tolerance: 0.25                # ±25% → [1.65, 2.75]

  # I.3b Midlatitude geostrophic balance (daily 850 hPa, 30–60°)
  # Required, but declarable N/A for submissions with no dynamical
  # representation of the atmosphere (`score --not-applicable geostrophic_balance`).
  geostrophic_balance:
    requirement: required
    spatial_corr_min: 0.9

  # I.3c Tropical precipitation–buoyancy (P′ vs column-MSE′, 20S–20N)
  precip_buoyancy:
    requirement: required              # (no diagnostic yet — metrics_reference I.3c)
    rel_tolerance_vs_obs: 0.30         # slope within ±30% of GPCP/ERA5

  # I.4a GFMIP SST patch experiments
  gfmip_patch:
    requirement: extended              # GFMIP patch runs are not part of CMIP6
    delta_lambda_min: 0.5              # W m-2 K-1, λ_EP − λ_WP

  # I.4b amip-4xCO2 effective radiative forcing
  amip_4xco2_erf:
    requirement: required
    range: [6.5, 9.0]                  # W m-2

  # I.5 ENSO (piControl ≥ 100 yr)
  enso:
    requirement: required              # I.5a/b/c
    amplitude_range: [0.5, 1.4]        # K, σ(Niño-3.4)
    band_power_ratio_min: 1.5          # power(2–7 yr) / power(1–2 yr)
    teleconnection_obs_factor: 2.0     # regressions within factor 2 of ERA5/GPCP
    teleconnection_t_min: 0.0          # tropical ta500 regression > 0 (sign)
    teleconnection_pr_max: 0.0         # Maritime Continent pr regression < 0
    # TODO: observed regression coefficients (ERA5 ta500, GPCP pr on Niño-3.4)
    # for the factor-2 amplitude check; null disables until wired
    teleconnection_reference_t: null
    teleconnection_reference_pr: null

  # I.5d MJO Wheeler–Kiladis
  mjo:
    requirement: extended              # not every architecture produces daily fields
    east_west_power_ratio_min: 1.5     # k = 1–3, 30–90 day

  # I.6a Land–ocean warming ratio (abrupt-4xCO2, last 50 yr)
  land_ocean_warming:
    requirement: required
    range: [1.2, 1.6]                  # strict pass criterion (paper 2026-09)
    equilibrium_years: 50

  # I.6b Arctic amplification (abrupt-4xCO2, last 50 yr)
  arctic_amplification:
    requirement: required
    ratio_min: 1.5
    lat_min: 66.5
    equilibrium_years: 50

  # I.6c ECS via Gregory regression (150 yr abrupt-4xCO2)
  ecs:
    requirement: required
    range: [1.0, 7.0]                  # K
    n_years: 150

  # I.7 Aerosol forcing (DAMIP hist-aer)
  aerosol_forcing:
    requirement: required              # promoted from Extended, 2026-09
    erf_range: [-2.0, -0.5]            # W m-2, 2015 aerosol ERF
    require_cooling: true              # ΔT(2015) < 0

  # I.8a Meridional heat transport partitioning (piControl)
  meridional_heat_transport:
    requirement: required
    omet_peak_range: [1.5, 2.0]        # PW
    omet_peak_lat_range: [15, 20]      # °N
    amet_peak_range: [4.0, 5.0]        # PW
    amet_peak_lat: 45                  # °N (±5)
    amet_peak_lat_tolerance: 5
    omet_search_band: [5, 30]          # °N band searched for the OMET peak
    amet_search_band: [25, 55]         # °N band searched for the AMET peak

  # I.8b ITCZ–energy flux equator (12-month climatology)
  itcz_efe:
    requirement: required
    slope_reference: 3.0               # ° / PW
    slope_rel_tolerance: 0.50          # ±50%
    corr_min: 0.9

  # (extra, code-only — pending paper reconciliation, metrics_reference.md #13)
  bjerknes:
    requirement: extra
    corr_max: -0.3                     # decadal AMET-OMET anti-correlation, 40-70N
  cc_scaling:
    requirement: extra
    slope_range: [5.0, 9.0]            # % / K (Held & Soden 2006: 7 ± 2)

tier2:
  # Start of the reserved post-2015 test window (paper Tier II scope). The CLI
  # derives its default Tier II timerange from this (`20150101/<last complete
  # year>1231`); the scoring layer uses it as the first scored year.
  test_window_start: 2015
  # Pre-test baseline: 1985–2014 (NOT 1990–2020, which overlapped the reserved
  # post-2015 test window). Used by the Climatology baseline row and as the
  # Pinatubo reference climatology.
  climatology_baseline_period: [1985, 2014]
  # Regime (a): fair (Ferro) CRPS with effective-sample-size correction on the
  # reported uncertainty. Fair CRPS is undefined for a deterministic forecast,
  # so a single-member model is reported as "n/a (single member)", never as
  # the absolute error.
  crps_ess_correction: true
  # Moving-block bootstrap of the time-mean fair CRPS (scoring_pass).
  bootstrap:
    block_length_monthly: 12           # steps (1 yr) for a monthly series
    block_length_annual: 3             # steps (3 yr) for an annual series
    n_boot: 1000                       # bootstrap replicates
    alpha: 0.05                        # -> 95% percentile interval
    resample_members: true             # also resample ensemble members
    seed: 20260914                     # fixed: every model gets the same resamples
  # Observational-uncertainty draws: fair CRPS averaged over K pseudo-
  # observations y_k ~ N(obs, sigma_obs), the SAME draws for a submission and
  # its baselines. n_draws applies only where a sigma_obs field is available;
  # none is plumbed through yet (HadCRUT5's error field is the first candidate),
  # so today every score runs at sigma_obs = 0 and the draws are a no-op.
  obs_uncertainty:
    n_draws: 100
    seed: 20260914
  # Regime (c): ensemble-consistency test
  consistency_p_value: 0.05            # two-sided
  eof_modes: 5                         # spatial fields: leading EOFs tested
  # Pinatubo response (1991-07 .. 1993-12 vs the climatology_baseline_period
  # climatology above, i.e. 1985–2014)
  pinatubo:
    requirement: diagnostic            # Tier II aggregated diagnostic, not a gate
    rsds_anomaly_max: 0.0              # dimming: global-mean anomaly < 0
    tas_anomaly_max: 0.0               # cooling: global-mean anomaly < 0
  # Aerosol-era hemispheric asymmetry
  hemispheric_asymmetry:
    requirement: diagnostic            # Tier II aggregated diagnostic, not a gate
    era: [1950, 1985]                  # the aerosol era the trends are taken over
    nh_minus_sh_trend_max: 0.0         # NH warming suppressed vs SH
    itcz_shift_max: 0.0                # southward ITCZ migration (°/decade)
  # Two-layer EBM parameters for the pattern-scaling baseline (Geoffroy 2013
  # multi-model means; recalibrate when the protocol fixes them)
  ebm:
    lambda_feedback: -1.3              # W m-2 K-1
    c_upper: 8.0                       # W yr m-2 K-1
    c_deep: 100.0                      # W yr m-2 K-1
    gamma: 0.7                         # W m-2 K-1
    efficacy: 1.3

tier3:
  # mid-Holocene North-Africa monsoon check
  midholocene_monsoon:
    requirement: extended              # mid-Holocene is Extended (paper 2026-09)
    jjas_pr_anom_min: 0.5              # mm day-1 vs piControl
    region: {lat: [10, 30], lon: [-20, 30]}
  # Perfect-model large-ensemble spread test (TODO Phase 5: settle bounds)
  le_spread:
    variance_ratio_range: [0.5, 2.0]
